<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F4A44">
<title>運行日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F2EA;
    --panel: #FFFFFF;
    --ink: #262320;
    --ink-soft: #6F6A61;
    --line: #DEDACD;
    --deep: #1F4A44;
    --deep-ink: #123330;
    --amber: #E3963E;
    --amber-deep: #B96F1F;
    --brick: #A6473C;
    --brick-deep: #7E332A;
    --paper-shadow: 0 1px 0 rgba(38,35,32,0.05);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding-bottom:112px;
    min-height:100vh;
    background:var(--bg);
  }
 
  /* ---------- Header ---------- */
  .head{
    background:var(--deep);
    color:#F4EFE3;
    padding:18px 18px 20px;
    border-radius:0 0 22px 22px;
  }
  .head-title{
    font-size:13px;
    letter-spacing:0.08em;
    color:#B9CFC9;
    margin:0 0 4px;
  }
  .head input[type=date]{
    background:transparent;
    border:none;
    color:#F4EFE3;
    font-size:20px;
    font-weight:700;
    font-family:inherit;
    padding:0;
    width:150px;
  }
  .driver-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .driver-field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .driver-field label{ font-size:11px; color:#B9CFC9; white-space:nowrap; }
  .driver-field input{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:10px;
    color:#F4EFE3;
    font-size:14.5px;
    font-family:inherit;
    padding:8px 10px;
    width:100%;
  }
  .driver-field input::placeholder{ color:#8FA9A2; }
 
  .section-label{
    padding:18px 18px 0;
    font-size:12.5px;
    font-weight:700;
    color:var(--deep-ink);
  }
 
  /* ---------- Cards (trips & vehicles share this look) ---------- */
  .trips{ padding:10px 18px 18px; display:flex; flex-direction:column; gap:14px; }
  .trip{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    box-shadow:var(--paper-shadow);
  }
  .trip-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
    cursor:pointer;
  }
  .trip-no{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:15px; color:var(--deep-ink);
  }
  .trip-no .badge{
    width:26px; height:26px; border-radius:50%;
    background:var(--deep); color:#F4EFE3;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-family:'Space Mono',monospace;
    flex-shrink:0;
  }
  .trip-no .hint{ font-size:11px; color:var(--ink-soft); font-weight:400; }
  .trip-del{
    border:none; background:transparent; color:var(--ink-soft);
    font-size:13px; padding:4px 6px; cursor:pointer;
  }
  .time-row{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .time-cell{
    flex:1;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 10px;
    display:flex; flex-direction:column; gap:6px;
  }
  .time-cell-label{ font-size:11px; color:var(--ink-soft); }
  .time-cell-value{
    font-family:'Space Mono', monospace;
    font-size:18px; font-weight:700; color:var(--ink);
    min-height:22px;
  }
  .time-cell button{
    align-self:flex-start;
    border:none; border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:700;
    font-family:inherit; color:#fff; background:var(--deep);
    cursor:pointer;
  }
  .time-cell button.done{ background:var(--line); color:var(--ink-soft); }
 
  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-soft); }
  .field input, .field textarea{
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:#FCFBF7;
    width:100%;
  }
  .field textarea{ resize:none; height:38px; }
 
  .pax-row{ display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; }
  .pax-field{ display:flex; flex-direction:column; gap:4px; }
  .pax-field label{ font-size:11px; color:var(--ink-soft); }
  .stepper{
    display:flex; align-items:center; border:1px solid var(--line);
    border-radius:10px; overflow:hidden; background:#FCFBF7;
  }
  .stepper button{
    border:none; background:transparent; width:32px; height:36px;
    font-size:17px; color:var(--deep); cursor:pointer;
  }
  .stepper .num{
    width:30px; text-align:center; font-family:'Space Mono',monospace;
    font-size:15px; font-weight:700;
  }
 
  .fare-box{
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    background:#FCFBF7;
    display:flex; flex-direction:column; gap:8px;
  }
  .fare-box-title{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .fare-grid{ display:flex; gap:8px; }
  .fare-grid .field input{ text-align:right; font-family:'Space Mono',monospace; font-weight:700; }
  .fare-breakdown{
    display:flex; flex-direction:column; gap:4px;
    font-size:12.5px; color:var(--ink-soft);
    border-top:1px dashed var(--line);
    padding-top:8px;
  }
  .fare-breakdown .row{ display:flex; justify-content:space-between; }
  .fare-breakdown .row.total{
    font-size:15px; font-weight:700; color:var(--deep-ink);
    font-family:'Space Mono',monospace;
  }
 
  .mini-fields{ display:flex; gap:8px; margin-top:8px; }
  .mini-field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .mini-field label{ font-size:11px; color:var(--ink-soft); }
  .mini-field input{
    border:1px solid var(--line); border-radius:10px; padding:8px 9px;
    font-size:14px; font-family:'Space Mono',monospace; font-weight:700;
    text-align:right; width:100%; background:#FCFBF7; color:var(--ink);
  }
  .dist-display{
    border:1px solid var(--line); border-radius:10px; padding:8px 9px;
    font-family:'Space Mono',monospace; font-weight:700; text-align:right;
    background:#F0EEE6; color:var(--deep-ink); font-size:14px;
  }
  .meter-warn{ font-size:11px; color:var(--brick); margin-top:6px; }
 
  .vehicle-total-bar{
    margin:0 18px 4px;
    background:var(--deep-ink);
    border-radius:14px;
    padding:12px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .vehicle-total-bar .label{ font-size:12px; color:#9FC1B9; }
  .vehicle-total-bar .value{ font-family:'Space Mono',monospace; font-size:22px; font-weight:700; color:#F4EFE3; }
  .vehicle-total-bar .value span{ font-size:13px; color:#9FC1B9; margin-left:4px; }
 
  /* ---------- Collapsed trip summary ---------- */
  .trip-summary{
    display:flex; align-items:center; gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    cursor:pointer;
  }
  .trip-summary-badge{
    width:26px; height:26px; border-radius:50%;
    background:var(--line); color:var(--deep-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-family:'Space Mono',monospace; font-weight:700;
    flex-shrink:0;
  }
  .trip-summary-body{ flex:1; min-width:0; }
  .trip-summary-route{
    font-size:14px; font-weight:700; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .trip-summary-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .trip-summary-del{
    border:none; background:transparent; color:var(--ink-soft);
    font-size:12px; padding:4px 6px; cursor:pointer; flex-shrink:0;
  }
 
  .add-trip{
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    width:calc(100% - 36px);
    margin:0 18px;
    padding:14px;
    border:1.5px dashed var(--deep);
    border-radius:14px;
    background:transparent;
    color:var(--deep-ink);
    font-family:inherit; font-weight:700; font-size:14.5px;
    cursor:pointer;
  }
 
  /* ---------- Summary bar ---------- */
  .summary{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background:var(--amber);
    color:#3A2408;
    padding:10px 18px 12px;
    box-shadow:0 -3px 12px rgba(0,0,0,0.12);
  }
  .summary-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .summary .sum-item{ display:flex; flex-direction:column; }
  .summary .sum-label{ font-size:10px; opacity:0.75; }
  .summary .sum-value{ font-family:'Space Mono',monospace; font-size:15px; font-weight:700; }
  .summary .sum-main .sum-value{ font-size:19px; }
  .save-btn{
    border:none; border-radius:12px; padding:10px 16px;
    background:var(--deep-ink); color:#F4EFE3;
    font-family:inherit; font-weight:700; font-size:13.5px;
    cursor:pointer;
  }
 
  .toast{
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%);
    background:var(--deep-ink); color:#F4EFE3;
    padding:10px 16px; border-radius:10px; font-size:13px;
    opacity:0; transition:opacity 0.25s; pointer-events:none;
    max-width:90%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
 
<script>
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxeriR7x-Yc4jVXfMp7wirM_kVjEPS811T6ck1bQwDw_vBuw6GEDJeNqpA1l5uGxJ6adQ/exec';
let saveTimer = null;
 
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nowTimeStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function newTrip(){
  return { id: 'trip-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    board:null, alight:null, from:'', to:'', male:0, female:0,
    fare:'', discountRate:'', ticketCount:'', note:'' };
}
function newVehicle(){
  return { id: 'veh-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    name:'', odoStart:'', odoEnd:'' };
}
function blankState(dateStr){
  const t = newTrip();
  return {
    date: dateStr,
    driverName:'',
    vehicles:[ newVehicle() ],
    trips:[ t ],
    activeTripId: t.id
  };
}
 
let state = blankState(todayStr());
 
function fmtKm(v){
  if(v===null || v===undefined || isNaN(v)) return '--';
  return v.toFixed(1);
}
const TICKET_VALUE = 500;
 
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
 
/* ---------- error fallback（真っ白のまま止まらないようにする） ---------- */
function showFatalError(msg){
  const app = document.getElementById('app');
  if(app){
    app.innerHTML = `<div style="padding:24px;font-family:sans-serif;color:#7E332A;background:#FBEAE7;line-height:1.6;">
      <b>エラーが発生しました</b><br>
      <span style="font-size:13px;">${(msg||'').toString().replace(/</g,'&lt;')}</span><br><br>
      <span style="font-size:12px;color:#555;">この画面のままの場合、ブラウザの開発者ツール（F12）のConsoleタブに詳細が出ています。</span>
    </div>`;
  }
}
window.addEventListener('error', e=> showFatalError(e.message));
window.addEventListener('unhandledrejection', e=> showFatalError(e.reason));
 
/* ---------- persistence ----------
   開発・テスト中はスプレッドシート連携を停止し、CSV書き出しのみにしています。
   仕様が固まったら、下の「完成後に復活させるコード」を戻してください。
------------------------------------------------------------------ */
function scheduleSave(){ /* テスト中は何もしない（CSVで都度書き出してください） */ }
 
function loadDate(dateStr){
  state = blankState(dateStr);
  render();
}
 
/* ---------- CSV書き出し ---------- */
function csvField(v){
  const s = (v===null || v===undefined) ? '' : String(v);
  return '"' + s.replace(/"/g,'""') + '"';
}
function csvRow(arr){ return arr.map(csvField).join(',') + '\r\n'; }
 
function buildCSV(){
  let out = '';
  out += csvRow(['日付', state.date]);
  out += csvRow(['運転者名', state.driverName]);
  out += '\r\n';
  out += csvRow(['車種','出発メーター','帰着メーター','走行距離(km)']);
  state.vehicles.forEach(v=>{
    const d = calcVehicleDist(v);
    out += csvRow([v.name, v.odoStart, v.odoEnd, d===null ? '' : d]);
  });
  const vt = vehicleTotalDist();
  out += csvRow(['合計走行距離(km)', vt===null ? '' : vt]);
  out += '\r\n';
  out += csvRow(['回数','乗車時間','降車時間','乗車地','降車地','男','女',
    '運賃','割引率(%)','タクシー券(枚)','割引額','タクシー券金額','現金受取額','備考']);
  state.trips.forEach((t, idx)=>{
    const c = calcTrip(t);
    out += csvRow([idx+1, t.board||'', t.alight||'', t.from||'', t.to||'',
      t.male||0, t.female||0, c.fare, Number(t.discountRate)||0, Number(t.ticketCount)||0,
      c.discountAmt, c.ticketAmt, c.cashDue, t.note||'']);
  });
  const tot = totals();
  out += '\r\n';
  out += csvRow(['合計人員(男/女/計)', `${tot.male}/${tot.female}/${tot.total}`]);
  out += csvRow(['現金回収合計', tot.cashSum]);
  return out;
}
 
function downloadCSV(){
  const csv = buildCSV();
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); // 先頭のBOMはExcelで文字化けしないようにするため
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `運行日誌_${state.date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSVを書き出しました');
}
 
/* ---------- 完成後に復活させるコード（スプレッドシート連携） ----------
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxeriR7x-Yc4jVXfMp7wirM_kVjEPS811T6ck1bQwDw_vBuw6GEDJeNqpA1l5uGxJ6adQ/exec';
 
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), timeoutMs || 10000);
  try{
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}
 
function buildPayload(){
  return {
    date: state.date,
    driverName: state.driverName || '',
    vehicles: state.vehicles.map(v=>({ name: v.name || '', odoStart: v.odoStart, odoEnd: v.odoEnd })),
    trips: state.trips.map(t=>{
      const c = calcTrip(t);
      return {
        board: t.board || '', alight: t.alight || '',
        from: t.from || '', to: t.to || '',
        male: Number(t.male)||0, female: Number(t.female)||0,
        fare: c.fare, discountRate: Number(t.discountRate)||0, ticketCount: Number(t.ticketCount)||0,
        discountAmt: c.discountAmt, ticketAmt: c.ticketAmt, cashDue: c.cashDue,
        note: t.note || ''
      };
    })
  };
}
 
async function sendSave(){
  const res = await fetchWithTimeout(SHEET_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(buildPayload())
  }, 10000);
  const data = await res.json();
  return !!(data && data.ok);
}
 
async function loadDateFromSheet(dateStr){
  showToast('読み込み中…');
  try{
    const res = await fetchWithTimeout(`${SHEET_API_URL}?date=${encodeURIComponent(dateStr)}`, {}, 10000);
    const data = await res.json();
    if(data && data.ok && data.exists){
      const hadTrips = data.trips && data.trips.length>0;
      const trips = hadTrips ? data.trips.map((r, idx)=>({
        id: 'trip-'+Date.now()+'-'+idx+'-'+Math.random().toString(36).slice(2,7),
        board: r.board || null, alight: r.alight || null,
        from: (r.from==null) ? '' : String(r.from), to: (r.to==null) ? '' : String(r.to),
        male: Number(r.male)||0, female: Number(r.female)||0,
        fare: r.fare === 0 ? 0 : (r.fare || ''),
        discountRate: r.discountRate === 0 ? '' : (r.discountRate || ''),
        ticketCount: r.ticketCount === 0 ? '' : (r.ticketCount || ''),
        note: (r.note==null) ? '' : String(r.note)
      })) : [newTrip()];
      const vehicles = (data.vehicles && data.vehicles.length>0) ? data.vehicles.map(v=>({
        id: 'veh-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
        name: (v.name==null) ? '' : String(v.name),
        odoStart: (v.odoStart===''||v.odoStart==null) ? '' : String(v.odoStart),
        odoEnd: (v.odoEnd===''||v.odoEnd==null) ? '' : String(v.odoEnd)
      })) : [ newVehicle() ];
      state = {
        date: dateStr,
        driverName: (data.driverName==null) ? '' : String(data.driverName),
        vehicles, trips, activeTripId: hadTrips ? null : trips[0].id
      };
    } else {
      state = blankState(dateStr);
    }
  } catch(e){
    state = blankState(dateStr);
    showToast(e.name === 'AbortError' ? '通信がタイムアウトしました' : 'スプレッドシートに接続できませんでした');
  }
  render();
}
 
function scheduleSaveToSheet(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const ok = await sendSave();
      if(!ok) showToast('保存に失敗しました');
    } catch(e){
      showToast('保存に失敗しました（通信エラー）');
    }
  }, 900);
}
------------------------------------------------------------------ */
 
/* ---------- trip actions ---------- */
function addTrip(){
  const nt = newTrip();
  state.trips.push(nt);
  state.activeTripId = nt.id;
  render(); scheduleSave();
}
function removeTrip(id){
  if(state.trips.length===1){ showToast('最後の1件は削除できません'); return; }
  state.trips = state.trips.filter(t=>t.id!==id);
  if(state.activeTripId === id) state.activeTripId = null;
  render(); scheduleSave();
}
function markBoard(id){
  const t = state.trips.find(t=>t.id===id);
  t.board = nowTimeStr();
  render(); scheduleSave();
}
function markAlight(id){
  const t = state.trips.find(t=>t.id===id);
  t.alight = nowTimeStr();
  render(); scheduleSave();
}
function updateField(id, key, value){
  const t = state.trips.find(t=>t.id===id);
  t[key] = value;
  renderTotalsOnly();
  updateTripBreakdown(id);
  scheduleSave();
}
function bumpPax(id, key, delta){
  const t = state.trips.find(t=>t.id===id);
  t[key] = Math.max(0, (t[key]||0) + delta);
  render(); scheduleSave();
}
function updateHead(key, value){
  state[key] = value;
  scheduleSave();
}
 
/* ---------- vehicle actions ---------- */
function addVehicle(){
  state.vehicles.push(newVehicle());
  render(); scheduleSave();
}
function removeVehicle(id){
  if(state.vehicles.length===1){ showToast('最後の1件は削除できません'); return; }
  state.vehicles = state.vehicles.filter(v=>v.id!==id);
  render(); scheduleSave();
}
function updateVehicleField(id, key, value){
  const v = state.vehicles.find(v=>v.id===id);
  v[key] = value;
  updateVehicleRowDisplay(id);
  updateVehicleTotalDisplay();
  scheduleSave();
}
 
/* ---------- calculations ---------- */
function calcTrip(t){
  const fare = Number(t.fare)||0;
  const rate = Number(t.discountRate)||0;
  const tickets = Number(t.ticketCount)||0;
  const discountAmt = Math.round(fare * (rate/100));
  const afterDiscount = Math.max(0, fare - discountAmt);
  const ticketAmt = tickets * TICKET_VALUE;
  const cashDue = Math.max(0, afterDiscount - ticketAmt);
  return { fare, discountAmt, afterDiscount, ticketAmt, cashDue };
}
function totals(){
  let male=0, female=0, fareSum=0, discountSum=0, ticketSum=0, cashSum=0;
  state.trips.forEach(t=>{
    male += Number(t.male)||0;
    female += Number(t.female)||0;
    const c = calcTrip(t);
    fareSum += c.fare;
    discountSum += c.discountAmt;
    ticketSum += c.ticketAmt;
    cashSum += c.cashDue;
  });
  return { male, female, total: male+female, fareSum, discountSum, ticketSum, cashSum };
}
function calcVehicleDist(v){
  if(v.odoStart==='' || v.odoEnd==='' || v.odoStart==null || v.odoEnd==null) return null;
  const s = Number(v.odoStart), e = Number(v.odoEnd);
  if(isNaN(s) || isNaN(e)) return null;
  const d = e - s;
  return d >= 0 ? d : null;
}
function vehicleHasNegative(v){
  if(v.odoStart==='' || v.odoEnd==='' || v.odoStart==null || v.odoEnd==null) return false;
  const s = Number(v.odoStart), e = Number(v.odoEnd);
  if(isNaN(s) || isNaN(e)) return false;
  return (e - s) < 0;
}
function vehicleTotalDist(){
  let total = 0, any = false;
  state.vehicles.forEach(v=>{
    const d = calcVehicleDist(v);
    if(d !== null){ total += d; any = true; }
  });
  return any ? total : null;
}
 
/* ---------- partial renders ---------- */
function updateVehicleRowDisplay(id){
  const v = state.vehicles.find(v=>v.id===id);
  const distEl = document.querySelector(`.veh-dist[data-id="${id}"]`);
  const warnEl = document.querySelector(`.veh-warn[data-id="${id}"]`);
  if(distEl){
    const d = calcVehicleDist(v);
    distEl.textContent = d===null ? '--' : fmtKm(d)+' km';
  }
  if(warnEl){
    warnEl.textContent = vehicleHasNegative(v) ? '帰着メーターが出発メーターより小さくなっています' : '';
  }
}
function updateVehicleTotalDisplay(){
  const el = document.getElementById('vehicle-total-value');
  if(!el) return;
  const t = vehicleTotalDist();
  el.innerHTML = t===null ? `--<span>km</span>` : `${fmtKm(t)}<span>km</span>`;
}
function updateTripBreakdown(id){
  const t = state.trips.find(t=>t.id===id);
  const c = calcTrip(t);
  const box = document.querySelector(`.fare-breakdown[data-id="${id}"]`);
  if(!box) return;
  box.innerHTML = `
    <div class="row"><span>割引額（${Number(t.discountRate)||0}%）</span><span>-¥${c.discountAmt.toLocaleString()}</span></div>
    <div class="row"><span>タクシー券（${Number(t.ticketCount)||0}枚）</span><span>-¥${c.ticketAmt.toLocaleString()}</span></div>
    <div class="row total"><span>現金受取額</span><span>¥${c.cashDue.toLocaleString()}</span></div>
  `;
}
function renderTotalsOnly(){
  const t = totals();
  const el = document.getElementById('summary-body');
  if(!el) return;
  el.innerHTML = summaryHTML(t);
}
function summaryHTML(t){
  return `
    <div class="sum-item">
      <span class="sum-label">乗車人員（男/女/計）</span>
      <span class="sum-value">${t.male} / ${t.female} / ${t.total}</span>
    </div>
    <div class="sum-item">
      <span class="sum-label">割引・券合計</span>
      <span class="sum-value">-¥${(t.discountSum+t.ticketSum).toLocaleString()}</span>
    </div>
    <div class="sum-item sum-main">
      <span class="sum-label">現金回収合計</span>
      <span class="sum-value">¥${t.cashSum.toLocaleString()}</span>
    </div>
  `;
}
 
function escapeAttr(s){
  return String(s===undefined || s===null ? '' : s).replace(/"/g,'&quot;');
}
function escapeText(s){
  return String(s===undefined || s===null ? '' : s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
 
/* ---------- full render ---------- */
function render(){
  const app = document.getElementById('app');
  const t = totals();
  const vt = vehicleTotalDist();
 
  app.innerHTML = `
    <div class="head">
      <p class="head-title">介護タクシー運行日誌</p>
      <input type="date" id="date-input" value="${state.date}">
      <div class="driver-row">
        <div class="driver-field">
          <label>運転者名</label>
          <input id="driver-input" type="text" placeholder="氏名を入力" value="${escapeAttr(state.driverName)}">
        </div>
      </div>
    </div>
 
    <div class="section-label">走行区間（車を乗り換えるたびに追加）</div>
    <div class="trips" id="vehicles"></div>
    <button class="add-trip" id="add-vehicle-btn">＋ 車両区間を追加</button>
 
    <div style="height:14px"></div>
    <div class="vehicle-total-bar">
      <span class="label">合計走行距離</span>
      <span class="value" id="vehicle-total-value">${vt===null ? '--<span>km</span>' : fmtKm(vt)+'<span>km</span>'}</span>
    </div>
 
    <div class="section-label">乗務記録</div>
    <div class="trips" id="trips"></div>
    <button class="add-trip" id="add-trip-btn">＋ 次の乗務を入力</button>
 
    <div style="height:14px"></div>
 
    <div class="summary">
      <div class="summary-row" id="summary-body">
        ${summaryHTML(t)}
      </div>
      <div class="summary-row" style="margin-top:8px; justify-content:flex-end;">
        <button class="save-btn" id="save-btn">CSVを書き出す</button>
      </div>
    </div>
  `;
 
  const vehiclesEl = document.getElementById('vehicles');
  state.vehicles.forEach((v, idx)=> vehiclesEl.appendChild(renderVehicleCard(v, idx+1)));
 
  const tripsEl = document.getElementById('trips');
  state.trips.forEach((tr, idx)=>{
    const isActive = tr.id === state.activeTripId;
    tripsEl.appendChild(isActive ? renderTripCard(tr, idx+1) : renderTripSummary(tr, idx+1));
  });
 
  document.getElementById('date-input').addEventListener('change', e=>{
    loadDate(e.target.value);
  });
  document.getElementById('driver-input').addEventListener('input', e=> updateHead('driverName', e.target.value));
  document.getElementById('add-vehicle-btn').addEventListener('click', addVehicle);
  document.getElementById('add-trip-btn').addEventListener('click', addTrip);
  document.getElementById('save-btn').addEventListener('click', downloadCSV);
}
 
function renderVehicleCard(v, no){
  const wrap = document.createElement('div');
  wrap.className = 'trip';
  const d = calcVehicleDist(v);
  const warn = vehicleHasNegative(v) ? '帰着メーターが出発メーターより小さくなっています' : '';
  wrap.innerHTML = `
    <div class="trip-head" style="cursor:default;">
      <div class="trip-no"><span class="badge">${no}</span>車両区間</div>
      <button class="trip-del" data-vehicle-del="${v.id}">削除</button>
    </div>
    <div class="field">
      <label>車種</label>
      <input type="text" data-vkey="name" data-id="${v.id}" value="${escapeAttr(v.name)}" placeholder="例：プリウス／ナンバー1234">
    </div>
    <div class="mini-fields">
      <div class="mini-field">
        <label>出発メーター(km)</label>
        <input type="number" inputmode="decimal" data-vkey="odoStart" data-id="${v.id}" value="${v.odoStart}">
      </div>
      <div class="mini-field">
        <label>帰着メーター(km)</label>
        <input type="number" inputmode="decimal" data-vkey="odoEnd" data-id="${v.id}" value="${v.odoEnd}">
      </div>
      <div class="mini-field">
        <label>区間距離</label>
        <div class="dist-display veh-dist" data-id="${v.id}">${d===null ? '--' : fmtKm(d)+' km'}</div>
      </div>
    </div>
    <div class="meter-warn veh-warn" data-id="${v.id}">${warn}</div>
  `;
  wrap.querySelector('[data-vehicle-del]').addEventListener('click', ()=> removeVehicle(v.id));
  wrap.querySelectorAll('[data-vkey]').forEach(el=>{
    el.addEventListener('input', ()=> updateVehicleField(v.id, el.dataset.vkey, el.value));
  });
  return wrap;
}
 
function renderTripSummary(t, no){
  const wrap = document.createElement('div');
  wrap.className = 'trip-summary';
  const c = calcTrip(t);
  const route = (!t.from && !t.to) ? '（未入力）' : `${t.from || '?'} → ${t.to || '?'}`;
  wrap.innerHTML = `
    <div class="trip-summary-badge">${no}</div>
    <div class="trip-summary-body">
      <div class="trip-summary-route">${escapeText(route)}</div>
      <div class="trip-summary-meta">男${t.male||0}・女${t.female||0} ｜ ¥${c.cashDue.toLocaleString()}</div>
    </div>
    <button class="trip-summary-del" data-id="${t.id}">削除</button>
  `;
  wrap.addEventListener('click', (e)=>{
    if(e.target.closest('.trip-summary-del')) return;
    state.activeTripId = t.id;
    render();
  });
  wrap.querySelector('.trip-summary-del').addEventListener('click', (e)=>{
    e.stopPropagation();
    removeTrip(t.id);
  });
  return wrap;
}
 
function renderTripCard(t, no){
  const wrap = document.createElement('div');
  wrap.className = 'trip';
  const c = calcTrip(t);
  wrap.innerHTML = `
    <div class="trip-head">
      <div class="trip-no"><span class="badge">${no}</span>乗務記録 <span class="hint">（タップでたたむ）</span></div>
      <button class="trip-del" data-id="${t.id}">削除</button>
    </div>
    <div class="time-row">
      <div class="time-cell">
        <span class="time-cell-label">乗車時間</span>
        <span class="time-cell-value">${t.board || '--:--'}</span>
        <button data-act="board" data-id="${t.id}" class="${t.board ? 'done':''}">${t.board ? '記録済み' : '乗車を記録'}</button>
      </div>
      <div class="time-cell">
        <span class="time-cell-label">降車時間</span>
        <span class="time-cell-value">${t.alight || '--:--'}</span>
        <button data-act="alight" data-id="${t.id}" class="${t.alight ? 'done':''}">${t.alight ? '記録済み' : '降車を記録'}</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>乗車地</label>
        <input type="text" data-key="from" data-id="${t.id}" value="${escapeAttr(t.from)}" placeholder="例：〇〇様宅">
      </div>
      <div class="field">
        <label>降車地</label>
        <input type="text" data-key="to" data-id="${t.id}" value="${escapeAttr(t.to)}" placeholder="例：〇〇病院">
      </div>
    </div>
    <div class="pax-row">
      <div class="pax-field">
        <label>男</label>
        <div class="stepper">
          <button data-pax="male" data-delta="-1" data-id="${t.id}">－</button>
          <span class="num">${t.male}</span>
          <button data-pax="male" data-delta="1" data-id="${t.id}">＋</button>
        </div>
      </div>
      <div class="pax-field">
        <label>女</label>
        <div class="stepper">
          <button data-pax="female" data-delta="-1" data-id="${t.id}">－</button>
          <span class="num">${t.female}</span>
          <button data-pax="female" data-delta="1" data-id="${t.id}">＋</button>
        </div>
      </div>
    </div>
    <div class="fare-box">
      <div class="fare-box-title">運賃・割引・タクシー券</div>
      <div class="fare-grid">
        <div class="field">
          <label>運賃（円）</label>
          <input type="number" inputmode="numeric" data-key="fare" data-id="${t.id}" value="${t.fare}" placeholder="0">
        </div>
        <div class="field">
          <label>割引率（%）</label>
          <input type="number" inputmode="numeric" data-key="discountRate" data-id="${t.id}" value="${t.discountRate}" placeholder="0">
        </div>
        <div class="field">
          <label>タクシー券（枚）</label>
          <input type="number" inputmode="numeric" data-key="ticketCount" data-id="${t.id}" value="${t.ticketCount}" placeholder="0">
        </div>
      </div>
      <div class="fare-breakdown" data-id="${t.id}">
        <div class="row"><span>割引額（${Number(t.discountRate)||0}%）</span><span>-¥${c.discountAmt.toLocaleString()}</span></div>
        <div class="row"><span>タクシー券（${Number(t.ticketCount)||0}枚）</span><span>-¥${c.ticketAmt.toLocaleString()}</span></div>
        <div class="row total"><span>現金受取額</span><span>¥${c.cashDue.toLocaleString()}</span></div>
      </div>
    </div>
    <div class="field" style="margin-top:8px;">
      <label>備考</label>
      <textarea data-key="note" data-id="${t.id}" placeholder="高速料金など">${escapeText(t.note||'')}</textarea>
    </div>
  `;
 
  wrap.querySelector('.trip-head').addEventListener('click', (e)=>{
    if(e.target.closest('.trip-del')) return;
    state.activeTripId = null;
    render();
  });
  wrap.querySelector('[data-act="board"]').addEventListener('click', (e)=>{ e.stopPropagation(); markBoard(t.id); });
  wrap.querySelector('[data-act="alight"]').addEventListener('click', (e)=>{ e.stopPropagation(); markAlight(t.id); });
  wrap.querySelector('.trip-del').addEventListener('click', (e)=>{ e.stopPropagation(); removeTrip(t.id); });
  wrap.querySelectorAll('input[data-key], textarea[data-key]').forEach(el=>{
    el.addEventListener('input', ()=> updateField(t.id, el.dataset.key, el.value));
    el.addEventListener('click', e=> e.stopPropagation());
  });
  wrap.querySelectorAll('[data-pax]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); bumpPax(t.id, btn.dataset.pax, Number(btn.dataset.delta)); });
  });
  return wrap;
}
 
/* ---------- init ---------- */
try{
  loadDate(todayStr());
}catch(e){
  showFatalError(e.message);
}
</script>
</body>
</html>
